name: Deploy Firebase Functions

# 此 workflow 為手動觸發 only。
# 預設 functions 變更後請本地執行：
#   cd functions && firebase deploy --only functions
# 若想啟用 CI 自動部署，請：
# 1. 建立 GCP service account 並下載 JSON key
# 2. 在 GitHub repo Settings → Secrets 加入 GCP_SA_KEY
# 3. 把上面 workflow_dispatch 之外，加回 push trigger
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy
        run: |
          npx firebase-tools deploy \
            --only functions,firestore:rules \
            --project teachers-ai-assistant-g4iph \
            --non-interactive \
            --force
